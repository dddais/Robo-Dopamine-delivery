# Robo-Dopamine Monitor Service 配置示例
#
# 用法:
#   python -m monitor_runtime.service --config configs/monitor.yaml
#
# 命令行参数会覆盖本文件里的同名项 (--port 覆盖 port, --backend 覆盖 backend, ...)。
# 未在本文件出现的字段使用代码内置默认值。
# 字段名与命令行长选项一一对应: --robot-runtime-url -> robot_runtime_url。

# ---------------- 服务 ----------------
host: 0.0.0.0
port: 8877

# deterministic: 简单轮询后端, 不加载模型 (默认)
# grm          : 后台持续 GRM 推理，poll 只读结果；steering 见 monitor_steering.yaml
backend: grm

# ---------------- Robot Runtime (图像源) ----------------
# 机器人运行时 HTTP 地址, 用来拉取最新的三视角 JPEG 帧
robot_runtime_url: <ip>:8767
# 固定拉取三路相机: cam_high, cam_left_wrist, cam_right_wrist
# 拉单张图的超时 (秒)
observation_timeout: 3.0

# ---------------- Deterministic 后端 (仅 backend=deterministic 用) ----------------
# 轮询多少次后强制判成功; 0 表示永不自动成功
auto_success_after_polls: 0

# ====================================================================
# 以下字段仅当 backend=grm 时生效
# ====================================================================

# GRM 权重路径 (HF repo id 或本地目录)
model_path: /path/to/Robo-Dopamine-GRM-2.0-4B-Preview

# 目标/参考图。没有目标图时用 examples/blank_goal.png (空白占位)
goal_image: /path/to/Robo-dopamine/examples/blank_goal.png

# 鱼眼去畸变配置 (fisheye_process/config.yaml)。不需要去畸变就留 null
# fisheye_config: /path/to/fisheye_process/config.yaml
fisheye_config: null

# 是否禁用 backward 模式 (禁用后只跑 forward + incremental)
no_backward: true

# 后台推理节拍 (秒)。GRM 在独立线程按此间隔持续推理, poll 只读最新结果
interval: 1.0

# 可选 GPU 绑定。留 null 时不修改当前进程环境变量
local_rank: null
cuda_visible_devices: null

# ---------------- 成功/失败判定 ----------------
# MonitorState 的阈值, 语义与 examples/online_inference_local_img_agent.py 完全一致
# 融合进度超过 success_threshold 且连续 success_stable_steps 步内
# 波动 (max-min) <= success_max_drift -> 判 success
success_threshold: 0.60
success_stable_steps: 3
success_max_drift: 0.05
# 融合度长期低于阈值且连续 fail_stable_steps 步内
# 每步增量都 < fail_min_progress (即平台期) -> 判 failed
fail_stable_steps: 8
fail_min_progress: 0.01
